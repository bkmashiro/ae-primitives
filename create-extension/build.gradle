plugins { id 'java'; id 'net.neoforged.moddev' version '2.0.78' }
group = 'dev.yuzhe.aeprimitives.kinetics'
version = rootProject.version
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories {
 mavenCentral()
 maven { name='Jared'; url='https://maven.blamejared.com' }
 maven { name='Create'; url='https://maven.createmod.net' }
 exclusiveContent { forRepository { maven { name='Modrinth'; url='https://api.modrinth.com/maven' } }; filter { includeGroup 'maven.modrinth' } }
}
dependencies {
 implementation project(':')
 implementation "maven.modrinth:ae2:${ae2_version}"
 implementation 'maven.modrinth:ldlib:mc1.21.1-2.2.37-neoforge'
 implementation 'maven.modrinth:create:6.0.10+mc1.21.1'
 compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
 compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.39.0.369'
 compileOnly 'mezz.jei:jei-1.21.1-neoforge:19.39.0.369'
 runtimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.39.0.369'
 runtimeOnly 'maven.modrinth:guideme:21.1.10'
 if (providers.gradleProperty('visualHarness').map { it.toBoolean() }.orElse(false).get()) {
  runtimeOnly files('../../minecraft-visual-harness/build/libs/minecraft-visual-harness-0.1.0-SNAPSHOT.jar')
  runtimeOnly 'maven.modrinth:kotlin-lang-forge:1.1.0-k2.0.21-1.21+neoforge'
 }
 testImplementation platform('org.junit:junit-bom:5.11.4')
 testImplementation 'org.junit.jupiter:junit-jupiter'
 testImplementation 'org.assertj:assertj-core:3.27.3'
}
neoForge {
 version = neoforge_version
 runs {
  client {
   client()
   gameDirectory = project.file('run-client')
   if (providers.gradleProperty('visualHarness').map { it.toBoolean() }.orElse(false).get()) systemProperty 'mcHarness.enabled', 'true'
   if (providers.gradleProperty('quickPlaySingleplayer').isPresent()) {
    programArgument '--quickPlaySingleplayer'
    programArgument providers.gradleProperty('quickPlaySingleplayer').get()
   }
  }
  server { server(); programArgument '--nogui'; gameDirectory = project.file('run-server') }
  gameTestServer { type='gameTestServer'; gameDirectory=project.file('build/gametest'); systemProperty 'neoforge.enabledGameTestNamespaces','aeprimitives_kinetics' }
 }
 mods {
  aeprimitives { sourceSet rootProject.sourceSets.main }
  aeprimitivesKinetics { sourceSet sourceSets.main }
 }
 unitTest { enable(); testedMod = mods.aeprimitivesKinetics }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }
tasks.named('jar', Jar) {
 archiveBaseName = 'ae-primitives-kinetics'
 exclude 'dev/yuzhe/aeprimitives/kinetics/content/KineticMachineGameTests.class'
 exclude 'data/aeprimitives_kinetics/structure/empty.nbt'
}
test { useJUnitPlatform() }
def expandedModVersion=providers.gradleProperty('mod_version').get()
processResources { inputs.property 'version',expandedModVersion; filesMatching('META-INF/neoforge.mods.toml'){ expand version:expandedModVersion } }
