plugins { id 'java'; id 'net.neoforged.moddev' version '2.0.78' }
group = 'dev.yuzhe.aeprimitives.farmersdelight'
version = rootProject.version
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories {
 mavenCentral()
 exclusiveContent { forRepository { maven { name='Modrinth'; url='https://api.modrinth.com/maven' } }; filter { includeGroup 'maven.modrinth' } }
}
dependencies {
 implementation project(':')
 implementation "maven.modrinth:ae2:${ae2_version}"
 implementation 'maven.modrinth:farmers-delight:1.21.1-1.2.8'
 runtimeOnly 'maven.modrinth:guideme:21.1.10'
 testImplementation platform('org.junit:junit-bom:5.11.4')
 testImplementation 'org.junit.jupiter:junit-jupiter'
}
neoForge {
 version = neoforge_version
 runs {
  client { client(); gameDirectory = project.file('run-client') }
  server { server(); programArgument '--nogui'; gameDirectory = project.file('run-server') }
  gameTestServer { type='gameTestServer'; gameDirectory=project.file('build/gametest'); systemProperty 'neoforge.enabledGameTestNamespaces','aeprimitives_farmersdelight' }
 }
 mods {
  aeprimitives { sourceSet rootProject.sourceSets.main }
  aeprimitivesFarmersDelight { sourceSet sourceSets.main }
 }
 unitTest { enable(); testedMod = mods.aeprimitivesFarmersDelight }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }
tasks.named('jar', Jar) {
 archiveBaseName = 'ae-primitives-farmers-delight'
 exclude 'dev/yuzhe/aeprimitives/farmersdelight/content/FarmersDelightGameTests.class'
 exclude 'data/aeprimitives_farmersdelight/structure/empty.nbt'
}
test { useJUnitPlatform() }
def expandedModVersion=providers.gradleProperty('mod_version').get()
processResources { inputs.property 'version',expandedModVersion; filesMatching('META-INF/neoforge.mods.toml'){ expand version:expandedModVersion } }
