plugins { id 'java'; id 'net.neoforged.moddev' version '2.0.78' }
group = 'dev.yuzhe.aeprimitives'
version = mod_version
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories {
 mavenCentral()
 maven { name='Jared'; url='https://maven.blamejared.com' }
 maven { name='Create'; url='https://maven.createmod.net' }
 exclusiveContent { forRepository { maven { name='Modrinth'; url='https://api.modrinth.com/maven' } }; filter { includeGroup 'maven.modrinth' } }
}
dependencies {
 implementation "maven.modrinth:ae2:${ae2_version}"
 implementation 'maven.modrinth:ldlib:mc1.21.1-2.2.37-neoforge'
 compileOnly 'dev.vfyjxf:taffy:1.1.4'
 compileOnly 'org.appliedenergistics.yoga:yoga:1.0.0'
 compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
 runtimeOnly 'maven.modrinth:guideme:21.1.10'
 if (providers.gradleProperty('visualHarness').map { it.toBoolean() }.orElse(false).get()) {
  runtimeOnly files('../minecraft-visual-harness/build/libs/minecraft-visual-harness-0.1.0-SNAPSHOT.jar')
  runtimeOnly 'maven.modrinth:kotlin-lang-forge:1.1.0-k2.0.21-1.21+neoforge'
 }
 testImplementation platform('org.junit:junit-bom:5.11.4')
 testImplementation 'org.junit.jupiter:junit-jupiter'
 testImplementation 'org.assertj:assertj-core:3.27.3'
}
neoForge {
 version = neoforge_version
 runs {
  client {
   client()
   gameDirectory = project.file('run-client')
   if (providers.gradleProperty('visualHarness').map { it.toBoolean() }.orElse(false).get()) {
    systemProperty 'mcHarness.enabled', 'true'
   }
   if (providers.gradleProperty('quickPlayMultiplayer').isPresent()) {
    programArgument '--quickPlayMultiplayer'
    programArgument providers.gradleProperty('quickPlayMultiplayer').get()
   }
   if (providers.gradleProperty('quickPlaySingleplayer').isPresent()) {
    programArgument '--quickPlaySingleplayer'
    programArgument providers.gradleProperty('quickPlaySingleplayer').get()
   }
  }
  server { server(); programArgument '--nogui'; gameDirectory = project.file('run-server') }
  gameTestServer { type='gameTestServer'; gameDirectory=project.file('build/gametest'); systemProperty 'neoforge.enabledGameTestNamespaces','aeprimitives' }
 }
 mods { aeprimitives { sourceSet sourceSets.main } }
 unitTest { enable(); testedMod = mods.aeprimitives }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }
tasks.named('jar', Jar) { exclude 'dev/yuzhe/aeprimitives/gametest/**'; exclude 'data/aeprimitives/structure/empty.nbt' }
tasks.register('verifyAll') { group='verification'; dependsOn tasks.named('build'), tasks.named('runGameTestServer') }
tasks.register('machineAssetTests', Exec) {
 group='verification'
 description='Run the deterministic CSG, texture and lint unit tests.'
 commandLine 'python3', '-m', 'unittest', 'discover', '-s', 'tools/tests', '-v'
 inputs.files fileTree('tools') { include 'machine_assets.py', 'tests/**/*.py' }
}
tasks.register('generateMachineAssets', Exec) {
 group='build'
 description='Compile declarative CSG machine specs into Minecraft models and textures.'
 commandLine 'python3', project.file('tools/generate_machine_assets.py')
 inputs.files fileTree('assets-src') { include 'machines/*.json', 'multiblocks/*.json' }
 inputs.files project.files('tools/machine_assets.py', 'tools/generate_machine_assets.py')
 outputs.files fileTree('src/main/resources/assets/aeprimitives/models/block') {
  include 'fortune_chamber.json', 'transformation_chamber.json', 'growth_chamber.json', 'compost_chamber.json'
  include 'concrete_curing_chamber.json', 'soil_processor.json', 'dripstone_reservoir.json', 'oxidation_chamber.json'
  include 'crop_cultivator.json', 'tree_nursery.json', 'growth_rack.json', 'apiary_chamber.json', 'batch_gate.json', 'cooling_plate.json'
 }
 outputs.files fileTree('src/main/resources/assets/aeprimitives/animations') { include '*.json' }
 outputs.files fileTree('src/main/resources/assets/aeprimitives/textures/block') {
  include 'fortune_*.png', 'transformation_*.png', 'growth_*.png', 'compost_*.png', 'foundry_*.png'
  include 'wet_mix.png', 'earth.png', 'liquid.png', 'copper.png', 'crop.png', 'foliage.png', 'vine.png', 'honey.png', 'packet.png', 'coolant.png'
 }
 outputs.dir layout.buildDirectory.dir('machine-assets/multiblocks')
 outputs.file layout.buildDirectory.file('machine-assets/report.json')
}
tasks.register('lintMachineAssets', Exec) {
 group='verification'
 description='Fail when generated machine assets contain a lint diagnostic.'
 dependsOn tasks.named('machineAssetTests'), tasks.named('generateMachineAssets')
 commandLine 'python3', project.file('tools/lint_machine_asset_report.py')
 inputs.file layout.buildDirectory.file('machine-assets/report.json')
 inputs.file project.file('tools/lint_machine_asset_report.py')
}
tasks.named('processResources') { dependsOn tasks.named('generateMachineAssets') }
tasks.named('verifyAll') { dependsOn tasks.named('lintMachineAssets') }
tasks.named('verifyAll') { dependsOn ':create-extension:build' }
tasks.register('visualGallery', Exec) {
 group='verification'
 description='Generate an interactive gallery from the shipped block models and textures.'
 commandLine 'python3', project.file('tools/render_block_gallery.py')
 inputs.files fileTree('src/main/resources/assets/aeprimitives') { include 'models/block/*.json', 'textures/**/*.png' }
 inputs.file project.file('tools/render_block_gallery.py')
 outputs.file layout.buildDirectory.file('visual-gallery/index.html')
}
tasks.named('visualGallery') { dependsOn tasks.named('generateMachineAssets') }
tasks.register('exportVisualGallery', Exec) {
 group='verification'
 description='Export the block gallery and individual machine previews to PNG without opening a browser.'
 dependsOn tasks.named('visualGallery')
 commandLine 'python3', project.file('tools/export_block_gallery.py')
 inputs.file project.file('tools/export_block_gallery.py')
 inputs.file layout.buildDirectory.file('visual-gallery/index.html')
 outputs.dir layout.buildDirectory.dir('visual-gallery/images')
}
tasks.register('exportMachineAnimation', Exec) {
 group='verification'
 description='Export the Fortune Chamber animation through a running Minecraft Visual Harness client.'
 commandLine 'python3', project.file('tools/export_machine_animation.py')
 inputs.files project.files('tools/export_machine_animation.py', 'assets-src/previews/fortune-animation.json')
}
test { useJUnitPlatform() }
def expandedModVersion=providers.gradleProperty('mod_version').get()
processResources { inputs.property 'version',expandedModVersion; filesMatching('META-INF/neoforge.mods.toml'){ expand version:expandedModVersion } }
