plugins { id 'java'; id 'net.neoforged.moddev' version '2.0.78' }
group = 'dev.yuzhe.aeprimitives'
version = mod_version
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { exclusiveContent { forRepository { maven { name='Modrinth'; url='https://api.modrinth.com/maven' } }; filter { includeGroup 'maven.modrinth' } } }
dependencies {
 implementation "maven.modrinth:ae2:${ae2_version}"
 runtimeOnly 'maven.modrinth:guideme:21.1.10'
 testImplementation platform('org.junit:junit-bom:5.11.4')
 testImplementation 'org.junit.jupiter:junit-jupiter'
 testImplementation 'org.assertj:assertj-core:3.27.3'
}
neoForge {
 version = neoforge_version
 runs {
  client {
   client()
   gameDirectory = project.file('run-client')
   if (providers.gradleProperty('quickPlayMultiplayer').isPresent()) {
    programArgument '--quickPlayMultiplayer'
    programArgument providers.gradleProperty('quickPlayMultiplayer').get()
   }
  }
  server { server(); programArgument '--nogui'; gameDirectory = project.file('run-server') }
  gameTestServer { type='gameTestServer'; gameDirectory=project.file('build/gametest'); systemProperty 'neoforge.enabledGameTestNamespaces','aeprimitives' }
 }
 mods { aeprimitives { sourceSet sourceSets.main } }
 unitTest { enable(); testedMod = mods.aeprimitives }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }
tasks.named('jar', Jar) { exclude 'dev/yuzhe/aeprimitives/gametest/**'; exclude 'data/aeprimitives/structure/empty.nbt' }
tasks.register('verifyAll') { group='verification'; dependsOn tasks.named('build'), tasks.named('runGameTestServer') }
tasks.register('visualGallery', Exec) {
 group='verification'
 description='Generate an interactive gallery from the shipped block models and textures.'
 commandLine 'python3', project.file('tools/render_block_gallery.py')
 inputs.files fileTree('src/main/resources/assets/aeprimitives') { include 'models/block/*.json', 'textures/**/*.png' }
 inputs.file project.file('tools/render_block_gallery.py')
 outputs.file layout.buildDirectory.file('visual-gallery/index.html')
}
tasks.register('exportVisualGallery', Exec) {
 group='verification'
 description='Export the block gallery and individual machine previews to PNG without opening a browser.'
 dependsOn tasks.named('visualGallery')
 commandLine 'python3', project.file('tools/export_block_gallery.py')
 inputs.file project.file('tools/export_block_gallery.py')
 inputs.file layout.buildDirectory.file('visual-gallery/index.html')
 outputs.dir layout.buildDirectory.dir('visual-gallery/images')
}
test { useJUnitPlatform() }
def expandedModVersion=providers.gradleProperty('mod_version').get()
processResources { inputs.property 'version',expandedModVersion; filesMatching('META-INF/neoforge.mods.toml'){ expand version:expandedModVersion } }
